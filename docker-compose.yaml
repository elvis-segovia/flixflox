services:
  api:
    build: .
    ports:
      - "7777:7777"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/flixflox}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-only-secret-not-for-production-use-32plus}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - UPLOAD_FOLDER=${UPLOAD_FOLDER:-/app/uploads}
      - PORT=7777
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.2.7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:
  uploads: